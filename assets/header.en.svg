<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Guilherme Queiroz Ribeiro - Software Engineer">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="90%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orangeGlow" cx="10%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.4"/>
    </pattern>
    <style>
      .pulseDot { animation: pulse 2s infinite ease-in-out; }
      @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }
    </style>
  </defs>

  <!-- Background with grid and glow -->
  <rect width="900" height="230" rx="20" fill="url(#cardGrad)"/>
  <rect width="900" height="230" rx="20" fill="url(#dotPattern)"/>
  <rect width="900" height="230" rx="20" fill="url(#cyanGlow)"/>
  <rect width="900" height="230" rx="20" fill="url(#orangeGlow)"/>
  <rect x="1" y="1" width="898" height="228" rx="19" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Status Badge at top right -->
  <g transform="translate(680, 28)">
    <rect width="170" height="30" rx="15" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="15" r="4.5" fill="#10B981" class="pulseDot"/>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Active Shipping</text>
  </g>

  <!-- Main Title -->
  <text x="44" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#F8FAFC" letter-spacing="-0.02em">
    Guilherme Queiroz Ribeiro
  </text>

  <!-- Subtitle and Tagline -->
  <text x="44" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#38BDF8">
    Software Engineer
    <tspan fill="#64748B" font-weight="400"> / </tspan>
    <tspan fill="#E2E8F0" font-weight="500">Mobile, Web &amp; APIs</tspan>
  </text>

  <text x="44" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#94A3B8">
    Building App Store applications and end-to-end web platforms.
  </text>

  <!-- Quick Tags in Pills -->
  <g transform="translate(44, 172)">
    <rect x="0" y="0" width="175" height="28" rx="7" fill="#0F172A" stroke="#1E293B"/>
    <text x="12" y="18" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#06B6D4">Flutter &amp; React Native</text>

    <rect x="187" y="0" width="145" height="28" rx="7" fill="#0F172A" stroke="#1E293B"/>
    <text x="199" y="18" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#F59E0B">Next.js &amp; Node.js</text>

    <rect x="344" y="0" width="140" height="28" rx="7" fill="#0F172A" stroke="#1E293B"/>
    <text x="356" y="18" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#10B981">MySQL &amp; Postgres</text>

    <rect x="496" y="0" width="110" height="28" rx="7" fill="#0F172A" stroke="#1E293B"/>
    <text x="508" y="18" font-family="ui-monospace, monospace" font-size="12" font-weight="500" fill="#94A3B8">Brasília, Brazil</text>
  </g>
</svg>
