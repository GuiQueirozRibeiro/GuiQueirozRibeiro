<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="Tech Stack - Guilherme Queiroz Ribeiro">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#080B10" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="blockBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="cyanAmbient" cx="10%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleAmbient" cx="90%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <style>
      .chip { transition: all 0.3s ease; }
      .tech-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
      .tech-item { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .tech-sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; }
      @keyframes shimmer { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
      .shimmer { animation: shimmer 3s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="290" rx="18" fill="url(#cardBg)"/>
  <rect width="900" height="290" rx="18" fill="url(#cyanAmbient)"/>
  <rect width="900" height="290" rx="18" fill="url(#purpleAmbient)"/>
  <rect x="1" y="1" width="898" height="288" rx="17" fill="none" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="6" cy="6" r="4.5" fill="#38BDF8" class="shimmer"/>
    <text x="20" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC" letter-spacing="-0.01em">TECH STACK &amp; ECOSYSTEM</text>
    <text x="750" y="10" font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="500" fill="#64748B" text-anchor="end">PRODUCTION &amp; SCALE</text>
  </g>

  <!-- ==================== BLOCK 1: MOBILE (X: 32) ==================== -->
  <g transform="translate(32, 54)">
    <rect width="195" height="210" rx="12" fill="url(#blockBg)" stroke="#21262D" stroke-width="1"/>
    
    <rect x="1" y="1" width="193" height="34" rx="11" fill="#131922"/>
    <circle cx="16" cy="18" r="3.5" fill="#38BDF8"/>
    <text x="27" y="22" class="tech-title" fill="#38BDF8">Mobile</text>

    <!-- Flutter -->
    <g transform="translate(14, 46)">
      <rect width="167" height="36" rx="8" fill="#0D1117" stroke="#21262D"/>
      <path d="M 12 25 L 20 17 L 15 12 L 23 12 L 20 15 L 25 15 L 21 19 L 26 24 L 21 24 L 18 21 L 14 25 Z" fill="#02569B"/>
      <path d="M 15 12 L 21 6 L 25 6 L 19 12 Z" fill="#54C5F8"/>
      <text x="32" y="20" class="tech-item" fill="#F0F6FC">Flutter</text>
      <text x="32" y="31" class="tech-sub" fill="#7D8590">iOS &amp; Android BLoC</text>
    </g>

    <!-- React Native -->
    <g transform="translate(14, 88)">
      <rect width="167" height="36" rx="8" fill="#0D1117" stroke="#21262D"/>
      <ellipse cx="20" cy="18" rx="8" ry="3.5" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(30 20 18)"/>
      <ellipse cx="20" cy="18" rx="8" ry="3.5" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(90 20 18)"/>
      <ellipse cx="20" cy="18" rx="8" ry="3.5" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(150 20 18)"/>
      <circle cx="20" cy="18" r="1.5" fill="#61DAFB"/>
      <text x="34" y="20" class="tech-item" fill="#F0F6FC">React Native</text>
      <text x="34" y="31" class="tech-sub" fill="#7D8590">Expo · EAS · OTA</text>
    </g>

    <!-- Dart & TS -->
    <g transform="translate(14, 130)">
      <rect width="167" height="36" rx="8" fill="#0D1117" stroke="#21262D"/>
      <path d="M 14 10 L 22 10 L 26 18 L 18 26 L 14 22 Z" fill="#0175C2" opacity="0.9"/>
      <text x="34" y="20" class="tech-item" fill="#F0F6FC">Dart &amp; Offline</text>
      <text x="34" y="31" class="tech-sub" fill="#7D8590">SQLite · AsyncStorage</text>
    </g>

    <!-- App Store Badge -->
    <g transform="translate(14, 172)">
      <rect width="167" height="26" rx="6" fill="#131D2A" stroke="#1E3A5F"/>
      <text x="83" y="17" class="tech-sub" fill="#38BDF8" text-anchor="middle" font-weight="600">4 App Store Releases</text>
    </g>
  </g>

