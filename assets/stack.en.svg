    <g transform="translate(14, 130)">
      <rect width="167" height="36" rx="8" fill="#0D1117" stroke="#21262D"/>
      <ellipse cx="20" cy="14" rx="7" ry="2.5" fill="none" stroke="#336791" stroke-width="1.2"/>
      <path d="M 13 14 L 13 22 C 13 24, 27 24, 27 22 L 27 14" fill="none" stroke="#336791" stroke-width="1.2"/>
      <text x="34" y="20" class="tech-item" fill="#F0F6FC">Postgres &amp; MySQL</text>
      <text x="34" y="31" class="tech-sub" fill="#7D8590">RLS · RBAC · Indexes</text>
    </g>

    <!-- Highlight -->
    <g transform="translate(14, 172)">
      <rect width="167" height="26" rx="6" fill="#13231D" stroke="#1F4738"/>
      <text x="83" y="17" class="tech-sub" fill="#6EE7B7" text-anchor="middle" font-weight="600">Decoupled APIs</text>
    </g>
  </g>

  <!-- ==================== BLOCK 4: ARCHITECTURE & DEVOPS (X: 677) ==================== -->
  <g transform="translate(677, 54)">
    <rect width="195" height="210" rx="12" fill="url(#blockBg)" stroke="#21262D" stroke-width="1"/>
    
    <rect x="1" y="1" width="193" height="34" rx="11" fill="#131922"/>
    <circle cx="16" cy="18" r="3.5" fill="#F59E0B"/>
    <text x="27" y="22" class="tech-title" fill="#F59E0B">Engineering</text>

    <!-- Docker -->
    <g transform="translate(14, 46)">
      <rect width="167" height="36" rx="8" fill="#0D1117" stroke="#21262D"/>
      <rect x="13" y="16" width="4" height="3" fill="#2496ED"/>
      <rect x="18" y="16" width="4" height="3" fill="#2496ED"/>
      <rect x="18" y="12" width="4" height="3" fill="#2496ED"/>
      <path d="M 11 20 C 12 24, 26 24, 27 20 Z" fill="#2496ED"/>
      <text x="34" y="20" class="tech-item" fill="#F0F6FC">Docker &amp; CI/CD</text>
      <text x="34" y="31" class="tech-sub" fill="#7D8590">GitHub Actions · Deploys</text>
    </g>

    <!-- Testes -->
    <g transform="translate(14, 88)">
      <rect width="167" height="36" rx="8" fill="#0D1117" stroke="#21262D"/>
      <circle cx="20" cy="18" r="6" fill="none" stroke="#10B981" stroke-width="1.3"/>
      <path d="M 17 18 L 19 20 L 23 16" fill="none" stroke="#10B981" stroke-width="1.3" stroke-linecap="round"/>
      <text x="34" y="20" class="tech-item" fill="#F0F6FC">Unit Testing</text>
      <text x="34" y="31" class="tech-sub" fill="#10B981">95%+ at Michelin</text>
    </g>

    <!-- Clean Arch -->
    <g transform="translate(14, 130)">
      <rect width="167" height="36" rx="8" fill="#0D1117" stroke="#21262D"/>
      <circle cx="20" cy="18" r="7" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2"/>
      <circle cx="20" cy="18" r="3.5" fill="#F59E0B"/>
      <text x="34" y="20" class="tech-item" fill="#F0F6FC">Clean Architecture</text>
      <text x="34" y="31" class="tech-sub" fill="#7D8590">SOLID · Offline-First</text>
    </g>

    <!-- Highlight -->
    <g transform="translate(14, 172)">
      <rect width="167" height="26" rx="6" fill="#271F15" stroke="#523B19"/>
      <text x="83" y="17" class="tech-sub" fill="#FCD34D" text-anchor="middle" font-weight="600">Squad Mentorship</text>
    </g>
  </g>
</svg>
