  <g transform="translate(247, 54)">
    <rect width="195" height="210" rx="12" fill="url(#blockBg)" stroke="#21262D" stroke-width="1"/>
    
    <rect x="1" y="1" width="193" height="34" rx="11" fill="#131922"/>
    <circle cx="16" cy="18" r="3.5" fill="#818CF8"/>
    <text x="27" y="22" class="tech-title" fill="#818CF8">Web &amp; Front</text>

    <!-- Next.js -->
    <g transform="translate(14, 46)">
      <rect width="167" height="36" rx="8" fill="#0D1117" stroke="#21262D"/>
      <circle cx="20" cy="18" r="8" fill="#000" stroke="#FFF" stroke-width="0.8"/>
      <path d="M 17 22 L 17 14 L 22 22 L 23 22 L 23 14" stroke="#FFF" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <text x="34" y="20" class="tech-item" fill="#F0F6FC">Next.js</text>
      <text x="34" y="31" class="tech-sub" fill="#7D8590">App Router · SSR · SEO</text>
    </g>

    <!-- TypeScript -->
    <g transform="translate(14, 88)">
      <rect width="167" height="36" rx="8" fill="#0D1117" stroke="#21262D"/>
      <rect x="12" y="10" width="16" height="16" rx="3" fill="#3178C6"/>
      <text x="20" y="22" font-family="sans-serif" font-size="9" font-weight="900" fill="#FFF" text-anchor="middle">TS</text>
      <text x="34" y="20" class="tech-item" fill="#F0F6FC">TypeScript</text>
      <text x="34" y="31" class="tech-sub" fill="#7D8590">Strict Typing &amp; Zod</text>
    </g>

    <!-- Tailwind -->
    <g transform="translate(14, 130)">
      <rect width="167" height="36" rx="8" fill="#0D1117" stroke="#21262D"/>
      <path d="M 14 18 C 17 14, 19 14, 21 16 C 22 17, 23 18, 26 18 C 23 22, 21 22, 19 20 C 18 19, 17 18, 14 18 Z" fill="#38BDF8"/>
      <text x="34" y="20" class="tech-item" fill="#F0F6FC">Tailwind CSS</text>
      <text x="34" y="31" class="tech-sub" fill="#7D8590">Design Systems &amp; GSAP</text>
    </g>

    <!-- Highlight -->
    <g transform="translate(14, 172)">
      <rect width="167" height="26" rx="6" fill="#17192F" stroke="#2E335B"/>
      <text x="83" y="17" class="tech-sub" fill="#A5B4FC" text-anchor="middle" font-weight="600">Multi-Tenant SaaS</text>
    </g>
  </g>

  <!-- ==================== BLOCK 3: BACKEND & DATA (X: 462) ==================== -->
  <g transform="translate(462, 54)">
    <rect width="195" height="210" rx="12" fill="url(#blockBg)" stroke="#21262D" stroke-width="1"/>
    
    <rect x="1" y="1" width="193" height="34" rx="11" fill="#131922"/>
    <circle cx="16" cy="18" r="3.5" fill="#34D399"/>
    <text x="27" y="22" class="tech-title" fill="#34D399">Backend &amp; DB</text>

