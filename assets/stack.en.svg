    <g transform="translate(14, 46)">
      <rect width="167" height="36" rx="8" fill="#0D1117" stroke="#21262D"/>
      <path d="M 20 10 L 27 14 L 27 22 L 20 26 L 13 22 L 13 14 Z" fill="none" stroke="#5FA04E" stroke-width="1.5"/>
      <text x="34" y="20" class="tech-item" fill="#F0F6FC">Node.js</text>
      <text x="34" y="31" class="tech-sub" fill="#7D8590">REST APIs &amp; Webhooks</text>
    </g>

    <!-- Prisma -->
    <g transform="translate(14, 88)">
      <rect width="167" height="36" rx="8" fill="#0D1117" stroke="#21262D"/>
      <path d="M 19 10 L 26 23 L 13 25 Z" fill="none" stroke="#A78BFA" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="34" y="20" class="tech-item" fill="#F0F6FC">Prisma ORM</text>
      <text x="34" y="31" class="tech-sub" fill="#7D8590">Modeling &amp; Migrations</text>
    </g>

